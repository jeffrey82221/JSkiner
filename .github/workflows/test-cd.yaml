name: Test Continuous Deployment
on:
  push:
    branches:
      - copilot/create-test-cd-file
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-linux-wheels:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-arg: ['3.8.16 3.8']
    steps:
      - uses: actions/checkout@v5
      - name: Build 
        run: |
          docker run --rm -v $(pwd):/io quay.io/pypa/manylinux2014_x86_64:${{ matrix.py-arg == '3.8.16 3.8' && '2025.02.23-1' || 'latest' }} bash \
            /io/build-wheels.sh ${{ matrix.py-arg }}
      - name: Cache
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.py-arg }} wheel
          path: dist/wheelhouse/*-manylinux*.whl
  deploy:
    runs-on: ubuntu-latest
    needs: [build-linux-wheels]
    steps:
      - name: start deploying
        uses: actions/checkout@v5
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
         path: wheelhouse
         merge-multiple: true
      - name: move wheel
        run: | 
         mkdir dist
         mv wheelhouse/*.whl dist/
         ls
         ls dist
      - name: Check Wheels
        run: |
          pip install twine
          python -m twine check dist/*.whl
